# Publishes a SimCast release from main: tag vX.Y (APP_VERSION in simcast/app.py), with SimCast-Setup.exe and
# SimCast-SimHub.zip (the SimHub plugin and dashboard, built by simhub-plugin.yml) attached and the README's
# "What's new" sections since the last release as the notes (tools/release_notes.sh). Run it by hand
# (Actions > Release > Run workflow) after the release commit is on main. It refuses to run if that version is
# already released or the tests fail. SimCast.exe and SimCast-Setup.exe are built here from main's source
# (build-windows.yml), not taken from git. Installed copies' update check and
# SimCoach's setup wizard both look for an asset named exactly SimCast-Setup.exe, and check the download against
# the SHA-256 GitHub shows for it.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  windows:
    needs: tests
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: main

  simhub:
    needs: tests
    uses: ./.github/workflows/simhub-plugin.yml

  release:
    needs: [windows, simhub]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Tested and built from main as it stands
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$RUN_SHA" ] || {
            echo "Run this workflow on main (main is at $(git rev-parse --short HEAD), this run tested ${RUN_SHA:0:7})."; exit 1; }
      - name: Version and notes
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' simcast/app.py)"
          [ -n "$VER" ] || { echo "APP_VERSION not found"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "v$VER is already tagged: set the next version in simcast/app.py first."; exit 1
          fi
          # every version since the last release, so one that never got a release of its own isn't left out
          PREV="$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)"
          tools/release_notes.sh "$VER" $PREV > notes.md
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SimCast-Windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SimCast-SimHub
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          gh release create "v$VER" SimCast-Setup.exe SimCast-SimHub.zip \
            --target "$(git rev-parse HEAD)" --title "SimCast v$VER" --notes-file notes.md --latest
